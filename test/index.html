<style>
:root{--bg:#f3f5f8;--card:#fff;--tx:#1d2733;--mu:#5d6876;--pr:#2381be;--ln:#e2e7ed;--rd:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1c222b;--tx:#e8edf3;--mu:#9aa5b1;--ln:#2a323d;--rd:#ff6b5e}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
.w{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.c{width:100%;max-width:360px;background:var(--card);border-radius:24px;padding:28px 22px;box-shadow:0 4px 18px rgba(20,30,50,.08);text-align:center}
.lg{width:64px;height:64px;border-radius:18px;background:var(--pr);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 18px;color:var(--mu);font-size:14px}
input[type=password]{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);font-size:17px;padding:0 14px;outline:none}
input[type=password]:focus{border-color:var(--pr)}
label{display:flex;align-items:center;gap:10px;justify-content:flex-start;min-height:44px;font-size:15px;margin:8px 0 10px;text-align:left}
label input{width:22px;height:22px;accent-color:var(--pr)}
button{width:100%;height:50px;border:0;border-radius:14px;background:var(--pr);color:#fff;font-size:17px;font-weight:600}
button:disabled{opacity:.6}.er{color:var(--rd);font-size:14px;min-height:20px;margin-top:10px}
</style></head><body>
